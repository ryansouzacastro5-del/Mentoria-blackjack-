<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout BLACKJACK</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050907;color:#f0fff6;font:16px Arial;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(520px,100%);background:#10251b;border:1px solid #19c37d66;border-radius:16px;padding:28px}.brand{color:#19c37d;letter-spacing:3px;font:bold 24px Georgia}.muted{color:#b8c8be}.price{font:48px Georgia;color:#19c37d;margin:12px 0}label{display:block;margin:18px 0 7px;font-weight:bold}input{width:100%;padding:15px;border-radius:8px;border:1px solid #466b58;background:#07110b;color:white;font-size:16px}.btn{width:100%;padding:16px;border:0;border-radius:8px;background:#19c37d;color:#04150c;font-weight:bold;font-size:15px;margin-top:22px;cursor:pointer}.btn:disabled{opacity:.5}.status{white-space:pre-wrap;margin-top:16px;color:#d9f5e5}a{color:#19c37d}
</style>
</head>
<body>
<main class="box">
<div class="brand">BLACKJACK</div>
<p class="muted">Atendimento direto no WhatsApp</p>
<h1>Mentoria de Estratégia</h1>
<div class="price">R$ 4,99</div>
<p class="muted">Pix e Cartão de Crédito • Vaga via WhatsApp</p>
<form id="f"><label>Nome completo</label><input id="nome" required minlength="5" placeholder="Seu nome completo"><label>E-mail</label><input id="email" type="email" required placeholder="Seu melhor e-mail"><button class="btn" id="go" type="submit">COMPRAR PELO WHATSAPP</button></form>
<div class="status" id="s"></div>
<p class="muted" style="font-size:13px"><a href="index.html">Voltar</a> • <a href="retorno.html">Já paguei, quero acessar</a></p>
</main>
<script>
const nomeEl=document.getElementById('nome'), emailEl=document.getElementById('email');
nomeEl.value=localStorage.getItem('bj_nome')||''; emailEl.value=localStorage.getItem('bj_email')||'';
document.getElementById('f').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const b=document.getElementById('go'), s=document.getElementById('s');
  const nome=nomeEl.value.trim(), email=emailEl.value.trim().toLowerCase();
  if(nome.split(/\s+/).length<2){ s.textContent='Informe nome e sobrenome'; return; }
  if(!email.includes('@')){ s.textContent='Informe um e-mail válido'; return; }

  localStorage.setItem('bj_nome', nome);
  localStorage.setItem('bj_email', email);

  s.textContent='Abrindo seu WhatsApp...';

  const msg = `Olá! Quero comprar a Mentoria BLACKJACK por R$ 4,99.%0A%0ANome: ${encodeURIComponent(nome)}%0AE-mail: ${encodeURIComponent(email)}%0A%0APode me passar o Pix / Link de pagamento?`;
  const wa = `https://wa.me/5569992959785?text=${msg}`;
  window.location.href = wa;
});
</script>
</body>
</html>
